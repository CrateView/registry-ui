name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Maintain release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: npm run version
          github-token: ${{ github.token }}
          create-github-releases: false
          push-git-tags: false
          pr-title: 'chore: release application'
          commit-message: 'chore: version application'
      - name: Start native CI on the release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          for attempt in {1..12}; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&per_page=1" --jq '.workflow_runs[0] // empty | "\(.id) \(.conclusion // "")"')"
            if [ -n "$run" ]; then
              read -r run_id conclusion <<< "$run"
              if [ "$conclusion" = 'action_required' ]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/approve"
              fi
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for the version PR CI event; rerun the Release workflow.' >&2
          exit 1
      - name: Determine release state
        id: state
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.state.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        if: steps.state.outputs.build == 'true' || steps.state.outputs.release == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Image metadata
        if: steps.state.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.state.outputs.version }}
            type=raw,value=latest
            type=sha
      - name: Build and publish image
        if: steps.state.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image and finish release
        if: steps.state.outputs.build == 'true' || steps.state.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
          NEEDS_TAG: ${{ steps.state.outputs.build }}
          NEEDS_RELEASE: ${{ steps.state.outputs.release }}
        run: |
          if [ "$NEEDS_TAG" != 'true' ]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          fi
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:v$VERSION"
          if [ "$NEEDS_TAG" = 'true' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if [ "$NEEDS_RELEASE" = 'true' ]; then
            gh release create "v$VERSION" --generate-notes --verify-tag
          fi
      - name: Pin documentation snapshot before dispatch setup
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.state.outputs.version }}
        run: node scripts/request-docs-promotion.mjs "v$RELEASE_VERSION" --persist
      - name: Create documentation dispatch token
        if: steps.changesets.outputs.has-changesets == 'false'
        id: docs-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: crateview
          repositories: website
          permission-actions: write
      - name: Persist and dispatch documentation promotion
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_PROMOTION_TOKEN: ${{ steps.docs-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.state.outputs.version }}
        run: node scripts/request-docs-promotion.mjs "v$RELEASE_VERSION"
