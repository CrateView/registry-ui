# docker compose -f compose.yaml -f compose.auth.token.yaml ...
# AUTH_PUBLIC_URL must be reachable by Docker clients and the Docker daemon over HTTPS.
services:
  registry:
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${AUTH_PUBLIC_URL:?Set the public HTTPS auth URL}/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${AUTH_SERVICE:?Set the registry audience}
      REGISTRY_AUTH_TOKEN_ISSUER: crateview-auth
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /keys/auth.crt
    volumes:
      - ${AUTH_KEYS_DIR:-./.dev/auth-keys}/auth.crt:/keys/auth.crt:ro
  auth:
    build: ./auth
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      AUTH_MODE: token
      AUTH_MANAGEMENT_SECRET: ${AUTH_MANAGEMENT_SECRET:?Set a random secret of at least 32 characters}
      AUTH_ISSUER: crateview-auth
      AUTH_SERVICE: ${AUTH_SERVICE:?Set the registry audience}
      AUTH_KEY_PATH: /keys/auth.key
      AUTH_CERTIFICATE_PATH: /keys/auth.crt
    volumes:
      - auth-data:/data
      - ${AUTH_KEYS_DIR:-./.dev/auth-keys}:/keys:ro
    restart: unless-stopped
  frontend:
    environment:
      NUXT_AUTH_MODE: token
      NUXT_AUTH_SERVICE_URL: http://auth:8080
      NUXT_AUTH_SERVICE_SECRET: ${AUTH_MANAGEMENT_SECRET:?Set AUTH_MANAGEMENT_SECRET}
      NUXT_AUTH_TOKEN_REALM: ${AUTH_PUBLIC_URL:?Set the public HTTPS auth URL}/token
      NUXT_USER_CREATION_ALLOWED_USERS: ${NUXT_USER_CREATION_ALLOWED_USERS:-}
    depends_on:
      - auth
volumes:
  auth-data:
