# docker compose -f compose.yaml -f compose.auth.basic.yaml ...
services:
  registry:
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - auth-data:/auth:ro
  auth:
    build: ./auth
    environment:
      AUTH_MODE: htpasswd
      AUTH_MANAGEMENT_SECRET: ${AUTH_MANAGEMENT_SECRET:?Set a random secret of at least 32 characters}
    volumes:
      - auth-data:/data
    restart: unless-stopped
  frontend:
    environment:
      NUXT_AUTH_MODE: htpasswd
      NUXT_AUTH_SERVICE_URL: http://auth:8080
      NUXT_AUTH_SERVICE_SECRET: ${AUTH_MANAGEMENT_SECRET:?Set AUTH_MANAGEMENT_SECRET}
      NUXT_USER_CREATION_ALLOWED_USERS: ${NUXT_USER_CREATION_ALLOWED_USERS:-}
    depends_on:
      - auth
volumes:
  auth-data:
