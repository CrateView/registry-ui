services:
  registry:
    image: registry:3.1.2
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped
  frontend:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NUXT_REGISTRY_UPSTREAM: http://registry:5000
      NUXT_REGISTRY_DELETE_ENABLED: ${NUXT_REGISTRY_DELETE_ENABLED:-false}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      NUXT_PUBLIC_THEME_PRIMARY: ${NUXT_PUBLIC_THEME_PRIMARY:-red}
      NUXT_PUBLIC_THEME_NEUTRAL: ${NUXT_PUBLIC_THEME_NEUTRAL:-zinc}
      NUXT_PUBLIC_THEME_RADIUS: ${NUXT_PUBLIC_THEME_RADIUS:-0.5rem}
      NUXT_PUBLIC_THEME_FONT_FAMILY: ${NUXT_PUBLIC_THEME_FONT_FAMILY:-Inter, ui-sans-serif, system-ui, sans-serif}
      NUXT_PUBLIC_BRAND_NAME: ${NUXT_PUBLIC_BRAND_NAME:-Crateview}
      NUXT_PUBLIC_BRAND_DESCRIPTION: ${NUXT_PUBLIC_BRAND_DESCRIPTION:-A modern interface for Docker and OCI container registries.}
      NUXT_PUBLIC_BRAND_LOGO_LIGHT: ${NUXT_PUBLIC_BRAND_LOGO_LIGHT:-/branding/crateview-mark-256.png}
      NUXT_PUBLIC_BRAND_LOGO_DARK: ${NUXT_PUBLIC_BRAND_LOGO_DARK:-/branding/crateview-mark-256.png}
      NUXT_PUBLIC_BRAND_FAVICON: ${NUXT_PUBLIC_BRAND_FAVICON:-/favicon.ico}
      NUXT_PUBLIC_BRAND_TITLE_TEMPLATE: ${NUXT_PUBLIC_BRAND_TITLE_TEMPLATE:-}
      NUXT_PUBLIC_BRAND_PRODUCT_URL: ${NUXT_PUBLIC_BRAND_PRODUCT_URL:-https://crateview.de}
      NUXT_PUBLIC_BRAND_DOCS_URL: ${NUXT_PUBLIC_BRAND_DOCS_URL:-https://github.com/CrateView/registry-ui#readme}
      NUXT_PUBLIC_BRAND_REPOSITORY_URL: ${NUXT_PUBLIC_BRAND_REPOSITORY_URL:-https://github.com/CrateView/registry-ui}
    depends_on:
      - registry
    restart: unless-stopped

volumes:
  registry-data:
