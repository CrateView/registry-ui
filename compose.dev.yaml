services:
  registry:
    image: registry:3.1.2
    ports:
      - '127.0.0.1:5050:5000'
    environment:
      OTEL_TRACES_EXPORTER: none
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - dev-registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  dev-registry-data:
